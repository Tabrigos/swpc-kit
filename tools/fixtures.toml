# Products recorded by tools/record_fixtures.py into tests/fixtures/<name>/.
#
# `reduce` shrinks a large JSON product: keep the first `head` and last `tail`
# groups of consecutive records sharing `group`, plus every `every`-th group.
# `array` names the array to reduce when the document is an object.

# Indices
[[product]]
name = "kp-3h"
url = "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"

[[product]]
name = "kp-forecast"
url = "https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json"

[[product]]
name = "kp-1m"
url = "https://services.swpc.noaa.gov/json/planetary_k_index_1m.json"

[[product]]
name = "dst"
url = "https://services.swpc.noaa.gov/products/kyoto-dst.json"

[[product]]
name = "f107-30-day"
url = "https://services.swpc.noaa.gov/products/10cm-flux-30-day.json"

[[product]]
name = "noaa-scales"
url = "https://services.swpc.noaa.gov/products/noaa-scales.json"

# Solar wind: ~1 day at 1-minute cadence, several sources per minute.
[[product]]
name = "rtsw-mag-1m"
url = "https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json"
reduce = { group = "time_tag", head = 30, tail = 30, every = 30 }

[[product]]
name = "rtsw-wind-1m"
url = "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
reduce = { group = "time_tag", head = 30, tail = 30, every = 30 }

# GOES: two X-ray bands per minute, eight proton energies every 5 minutes.
[[product]]
name = "goes-xrays-1-day"
url = "https://services.swpc.noaa.gov/json/goes/primary/xrays-1-day.json"
reduce = { group = "time_tag", head = 30, tail = 30, every = 20 }

[[product]]
name = "goes-protons-1-day"
url = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json"
reduce = { group = "time_tag", head = 12, tail = 12, every = 12 }

# Alerts
[[product]]
name = "alerts"
url = "https://services.swpc.noaa.gov/products/alerts.json"

# Text bulletins
[[product]]
name = "3-day-forecast"
url = "https://services.swpc.noaa.gov/text/3-day-forecast.txt"

[[product]]
name = "geomag-forecast"
url = "https://services.swpc.noaa.gov/text/3-day-geomag-forecast.txt"

[[product]]
name = "27-day-outlook"
url = "https://services.swpc.noaa.gov/text/27-day-outlook.txt"

# Grids. OVATION keeps whole longitudes (181 latitudes each).
[[product]]
name = "ovation-aurora"
url = "https://services.swpc.noaa.gov/json/ovation_aurora_latest.json"
reduce = { array = "coordinates", group = 0, head = 2, tail = 2, every = 30 }

[[product]]
name = "drap"
url = "https://services.swpc.noaa.gov/text/drap_global_frequencies.txt"
