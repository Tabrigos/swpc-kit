name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      # tests/test_skill.py checks that the built wheel ships the skill.
      - run: uv build --wheel
      - run: uv run pytest
        env:
          SKILL_WHEEL: dist/*.whl
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  # The lowest versions that pyproject.toml allows for the direct
  # dependencies (httpx2, numpy, rasterio), so that the minimums stay true.
  lowest:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      # rasterio before 1.5.2 multiplies affine transforms with `*`, which
      # affine 3 deprecates: a warning for users, an error under the test
      # settings (filterwarnings = error). The wheel does not depend on the
      # versions installed, and the checks job tests it already.
      - run: >-
          uv run pytest -W "ignore:Use:PendingDeprecationWarning"
          --deselect tests/test_skill.py::test_the_built_wheel_ships_the_skill
