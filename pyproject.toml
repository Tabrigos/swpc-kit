[project]
name = "swpc-kit"
dynamic = ["version"]
description = "Typed readers for NOAA SWPC space weather data products, with GeoJSON and GeoTIFF export."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sidereus Team", email = "sidereus.team@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["space weather", "noaa", "swpc", "aurora", "kp index", "geojson"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Tabrigos/swpc-kit"
Issues = "https://github.com/Tabrigos/swpc-kit/issues"
Changelog = "https://github.com/Tabrigos/swpc-kit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# HTTP client (swpc_kit.client): httpx2, the maintained continuation of
# httpx (see docs/FONTI.md, "HTTP client").
client = [
    "httpx2>=2.13",
]

[dependency-groups]
# numpy and rasterio only for the tests, which read back the GeoTIFF files
# with GDAL; the library writes them with the standard library.
dev = [
    "mypy>=1.17",
    "numpy>=2.0",
    "pytest>=8.4",
    "rasterio>=1.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/swpc_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/swpc_kit"]

# An explicit list, so that no local file ends up in the sdist.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "tools",
    "docs",
    "AGENTS.md",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "SPEC.md",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "PT",  # pytest style
    "DTZ", # naive datetimes
    "RUF", # ruff-specific
    "D",   # docstrings
]
ignore = [
    "D105", # magic methods
    "D107", # __init__ is documented in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests", "tools"]
mypy_path = "tools"

# rasterio (dev group) ships no inline types (no py.typed): its names are typed
# as Any. Only tests/test_export_geotiff.py uses it. The typeshed stubs
# (types-rasterio) would need a new dev dependency.
[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
